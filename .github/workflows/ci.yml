name: VITALINK CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Regenerate deterministic synthetic dataset
        run: |
          python scripts/generate_synthetic_data.py
          git diff --exit-code -- data/daily_demand.csv
      - name: Compile Python modules
        run: python -m compileall -q vitalink tests scripts
      - name: Run test suite
        run: pytest

  dashboard:
    name: Dashboard JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check dashboard JavaScript syntax
        run: node --check web/app.js
